<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakuna Matata — Quotes &amp; Invoices</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

  :root{
    --ink:#1C2226; --steel:#4C5A66; --line:#B9C0C6; --accent:#D65A31; --accent-dark:#B8481F;
    --paper:#F0F1F2; --bg:#EDEFF1; --panel:#FFFFFF; --success:#3F7D5C; --danger:#B23A32;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  #app{max-width:1200px;margin:0 auto;padding:0 16px 60px;}
  header.topbar{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:3px solid var(--ink);margin-bottom:14px;}
  header.topbar img{height:52px;}
  header.topbar h1{font-size:20px;margin:0;color:var(--ink);letter-spacing:.2px;}
  header.topbar .sub{font-size:12px;color:var(--steel);}
  nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  nav.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--steel);padding:8px 14px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;}
  nav.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  nav.tabs button:hover:not(.active){border-color:var(--accent);color:var(--ink);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px;}
  .card h2{margin-top:0;font-size:16px;color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:8px;display:inline-block;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  label{display:block;font-size:12px;font-weight:700;color:var(--steel);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .field{margin-bottom:12px;}
  button.btn{background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;}
  button.btn:hover{background:#000;}
  button.btn.accent{background:var(--accent);}
  button.btn.accent:hover{background:var(--accent-dark);}
  button.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  button.btn.ghost:hover{border-color:var(--ink);}
  button.btn.danger{background:var(--danger);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{background:var(--ink);color:#fff;text-align:left;padding:8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.3px;}
  table.data td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.data tr:hover td{background:#fafafa;}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .pill.draft{background:#e8e8e8;color:#555;}
  .pill.sent{background:#dbeafe;color:#1d4ed8;}
  .pill.accepted{background:#dcfce7;color:#15803d;}
  .pill.converted{background:#ede9fe;color:#6d28d9;}
  .pill.paid{background:#dcfce7;color:#15803d;}
  .pill.overdue{background:#fee2e2;color:#b91c1c;}
  .search-box{position:relative;}
  .search-results{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:5px;max-height:260px;overflow-y:auto;width:100%;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .search-results div{padding:8px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;}
  .search-results div:hover{background:var(--paper);}
  .search-results div .meta{color:var(--steel);font-size:11px;}
  .selected-box{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 12px;font-size:13px;}
  .selected-box b{color:var(--ink);}
  .lineitems-table th,.lineitems-table td{padding:6px 8px;}
  .totals-box{max-width:320px;margin-left:auto;font-size:14px;}
  .totals-box .trow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);}
  .totals-box .trow.total{font-weight:700;font-size:17px;border-top:2px solid var(--ink);border-bottom:none;color:var(--accent);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .note{font-size:12px;color:var(--steel);font-style:italic;}
  .badge-new{background:var(--accent);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .remove-x{color:var(--danger);cursor:pointer;font-weight:700;}

  /* ---- Print / Preview document styles ---- */
  #printArea{display:none;}
  .doc-page{background:#fff;max-width:850px;margin:0 auto;padding:36px 40px;}
  .doc-header{display:flex;justify-content:space-between;align-items:flex-start;}
  .doc-company b{font-size:15px;}
  .doc-company div{font-size:12px;color:var(--steel);margin-top:3px;}
  .doc-header img{height:80px;}
  .doc-title{font-size:30px;font-weight:800;color:var(--accent);margin:18px 0 10px;}
  .doc-twocol{display:flex;gap:20px;margin-bottom:16px;}
  .doc-billto{flex:1;font-size:13px;}
  .doc-billto b.name{font-size:14px;}
  .doc-detailbox{flex:1;border:1px solid var(--line);border-radius:2px;}
  .doc-detailbox .drow{display:flex;border-bottom:1px solid var(--line);}
  .doc-detailbox .drow:last-child{border-bottom:none;}
  .doc-detailbox .dlabel{flex:0 0 55%;background:var(--paper);font-weight:700;font-size:12px;padding:5px 8px;}
  .doc-detailbox .dval{flex:1;font-size:12px;padding:5px 8px;color:var(--steel);}
  table.doc-items{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:0;}
  table.doc-items th{background:var(--ink);color:#fff;padding:7px 8px;text-align:left;font-size:11px;text-transform:uppercase;}
  table.doc-items td{padding:7px 8px;border:1px solid var(--line);}
  table.doc-items th:nth-child(4),table.doc-items td:nth-child(4){text-align:center;}
  table.doc-items th:nth-child(5),table.doc-items td:nth-child(5),
  table.doc-items th:nth-child(6),table.doc-items td:nth-child(6){text-align:right;}
  .doc-totals{max-width:340px;margin-left:auto;font-size:13px;}
  .doc-totals .trow{display:flex;justify-content:space-between;padding:5px 8px;}
  .doc-totals .trow.total{font-weight:800;font-size:15px;border-top:2px solid var(--ink);color:var(--accent);}
  .doc-banking-heading{font-weight:800;font-size:13px;border-bottom:2px solid var(--accent);padding-bottom:4px;margin:22px 0 8px;}
  .doc-banking{display:flex;gap:30px;font-size:12px;}
  .doc-banking div b{display:block;margin-bottom:3px;}
  .doc-footer-row{display:flex;justify-content:space-between;margin-top:26px;font-size:13px;}
  .doc-footnote{font-size:10.5px;color:var(--steel);font-style:italic;margin-top:20px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;}
    .no-print{display:none!important;}
  }

  /* ============================================================
     Mobile layout (phones) — stacks the header, makes data tables
     display as cards instead of forcing horizontal scroll, and
     turns the line-items table into a single-column entry form.
     ============================================================ */
  @media (max-width: 700px){
    #app{padding:0 10px;}
    header.topbar{flex-wrap:wrap;padding:12px 0;gap:8px;}
    header.topbar img{height:40px;}
    header.topbar h1{font-size:16px;}
    header.topbar .sub{font-size:11px;}
    .topbar-right{width:100%;justify-content:space-between;margin-left:0;order:3;}
    nav.tabs{gap:5px;margin-bottom:12px;}
    nav.tabs button{padding:8px 10px;font-size:12px;flex:1 1 auto;}
    .card{padding:12px;}
    .row{gap:8px;}
    .col{min-width:100%!important;flex-basis:100%!important;}
    .toolbar{flex-direction:column;align-items:stretch;gap:8px;}
    .toolbar input[type=text]{max-width:100%!important;}
    button.btn{padding:10px 14px;font-size:14px;}
    button.btn.small{padding:8px 12px;font-size:13px;}

    /* Generic data tables -> stacked cards. Each <td> needs a
       data-label attribute (added in the JS) to show its column
       name above the value. */
    table.data{border:none;}
    table.data thead{display:none;}
    table.data, table.data tbody, table.data tr{display:block;width:100%;}
    table.data tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px 10px;background:#fff;}
    table.data tr:hover td{background:transparent;}
    table.data td{display:block;border:none;padding:5px 0;}
    table.data td[data-label]::before{content:attr(data-label);display:block;font-size:10px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
    table.data td:empty{display:none;}

    /* Line items entry table -> one card per line item, inputs
       stacked full-width with labels above them. */
    table.lineitems-table thead{display:none;}
    table.lineitems-table, table.lineitems-table tbody, table.lineitems-table tr{display:block;width:100%;}
    table.lineitems-table tr{border:1px solid var(--line);border-radius:8px;margin-bottom:12px;padding:10px;background:#fff;}
    table.lineitems-table td{display:block;border:none;padding:6px 0;text-align:left!important;}
    table.lineitems-table td[data-label]::before{content:attr(data-label);display:block;font-size:10px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}
    table.lineitems-table input, table.lineitems-table select{width:100%!important;}
    table.lineitems-table .remove-x{display:inline-block;padding:6px 14px;border:1px solid var(--danger);color:var(--danger);border-radius:5px;}

    .totals-box{max-width:100%;}
    .doc-page{padding:16px 14px;}
    .doc-header{flex-direction:column;gap:10px;}
    .doc-header img{height:56px;align-self:flex-end;}
    .doc-twocol{flex-direction:column;}
    table.doc-items{font-size:11px;}
    table.doc-items th,table.doc-items td{padding:5px 4px;}
    .doc-banking{flex-direction:column;gap:14px;}
    .doc-footer-row{flex-direction:column;gap:8px;}
  }

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .login-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.08);}
  .login-box img{height:56px;display:block;margin:0 auto 14px;}
  .login-box h1{font-size:17px;text-align:center;margin:0 0 4px;}
  .login-box .sub{font-size:12px;color:var(--steel);text-align:center;margin-bottom:22px;}
  .login-error{background:#fee2e2;color:#b91c1c;font-size:12px;padding:8px 10px;border-radius:5px;margin-bottom:12px;display:none;}
  .login-box button.btn{width:100%;margin-top:6px;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--steel);}
  #appRoot{display:none;}

</style>
</head>

let STATE = {
  customers: [],

/* ---------- DB row <-> app object mapping ---------- */
function mapCustomerFromDb(r) {
  return { num: r.num, name: r.name, contact: r.contact || '', email: r.email || '', phone: r.phone || '',
    address: r.address || '', city: r.city || '', postCode: r.post_code || '', vat: r.vat || '', reg: r.reg || '',
    chargeVat: r.charge_vat, terms: r.terms || '', disabled: r.disabled, isNew: r.is_new, exportedToQBO: r.exported_to_qbo };
}
function mapCustomerToDb(c) {
  return { num: c.num, name: c.name, contact: c.contact, email: c.email, phone: c.phone, address: c.address,
    city: c.city, post_code: c.postCode, vat: c.vat, reg: c.reg, charge_vat: c.chargeVat, terms: c.terms,
    disabled: !!c.disabled, is_new: !!c.isNew, exported_to_qbo: !!c.exportedToQBO };
}
function mapItemFromDb(r) {
  return { code: r.code, desc: r.description, price: Number(r.price) || 0, vat: r.vat, isNew: r.is_new,
    stockQty: (r.stock_qty === null || r.stock_qty === undefined) ? null : Number(r.stock_qty) };
}
function mapItemToDb(it) {
  return { code: it.code, description: it.desc, price: Number(it.price) || 0, vat: it.vat, is_new: !!it.isNew,
    stock_qty: (it.stockQty === null || it.stockQty === undefined || it.stockQty === '') ? null : Number(it.stockQty) };
}
function mapDocFromDb(r) {
  return { id: r.id, type: r.type, number: r.number, status: r.status, customer: r.customer_snapshot,
    truckReg: r.truck_reg || '', reg6m: r.reg_6m || '', reg12m: r.reg_12m || '', customerDepo: r.customer_depo || '',
    poNumber: r.po_number || '', jobcard: r.jobcard || '', tec: r.tec || '', hkm: r.hkm || '', quoteRef: r.quote_ref || '',
    issueDate: r.issue_date || '', dueDate: r.due_date || '', items: r.items || [],
    subtotal: Number(r.subtotal) || 0, taxTotal: Number(r.tax_total) || 0, total: Number(r.total) || 0,
    exportedToQBO: r.exported_to_qbo, stockDeducted: !!r.stock_deducted, createdAt: r.created_at, updatedAt: r.updated_at };
}
function mapDocToDb(d) {
  return { type: d.type, number: d.number, status: d.status, customer_num: d.customer.num, customer_snapshot: d.customer,
    truck_reg: d.truckReg, reg_6m: d.reg6m, reg_12m: d.reg12m, customer_depo: d.customerDepo, po_number: d.poNumber,
    jobcard: d.jobcard, tec: d.tec, hkm: d.hkm, quote_ref: d.quoteRef,
    issue_date: d.issueDate || null, due_date: d.dueDate || null,
    items: d.items, subtotal: d.subtotal, tax_total: d.taxTotal, total: d.total,
    exported_to_qbo: !!d.exportedToQBO, stock_deducted: !!d.stockDeducted,
    created_by: CURRENT_USER ? CURRENT_USER.id : null,
    created_by_email: CURRENT_USER ? CURRENT_USER.email : null };
}
function mapCompanyFromDb(r) {
  return { name: r.name, address: r.address, city: r.city, phone: r.phone, email: r.email, vat: r.vat, reg: r.reg,
    merchantNo: r.merchant_no, absaAcc: r.absa_acc, absaBranch: r.absa_branch, fnbAcc: r.fnb_acc, fnbBranch: r.fnb_branch,
    reorderThreshold: (r.reorder_threshold === null || r.reorder_threshold === undefined) ? 5 : Number(r.reorder_threshold) };
}
function mapCompanyToDb(c) {
  return { name: c.name, address: c.address, city: c.city, phone: c.phone, email: c.email, vat: c.vat, reg: c.reg,
    merchant_no: c.merchantNo, absa_acc: c.absaAcc, absa_branch: c.absaBranch, fnb_acc: c.fnbAcc, fnb_branch: c.fnbBranch,
    reorder_threshold: Number(c.reorderThreshold) || 5 };
}

/* ---------- Load everything after sign-in ---------- */
async function loadAll() {
  const [custRes, itemRes, docRes, counterRes, companyRes] = await Promise.all([
    supabaseClient.from('customers').select('*').order('name'),
    supabaseClient.from('items').select('*').order('description'),
    supabaseClient.from('documents').select('*').order('created_at', { ascending: false }),
    supabaseClient.from('counters').select('*').eq('id', 1).single(),
    supabaseClient.from('company_settings').select('*').eq('id', 1).single(),
  ]);
  const firstError = custRes.error || itemRes.error || docRes.error || counterRes.error || companyRes.error;
  if (firstError) {
    showLoadError(firstError.message);
    return false;
  }
  STATE.customers = (custRes.data || []).map(mapCustomerFromDb);
  STATE.items = (itemRes.data || []).map(mapItemFromDb);
  STATE.documents = (docRes.data || []).map(mapDocFromDb);
  STATE.counters = counterRes.data
    ? { customerNum: counterRes.data.customer_num, itemCode: counterRes.data.item_code, quoteNum: counterRes.data.quote_num, invoiceNum: counterRes.data.invoice_num }
    : { customerNum: 0, itemCode: 0, quoteNum: 1, invoiceNum: 1 };
  STATE.company = companyRes.data ? mapCompanyFromDb(companyRes.data) : DEFAULT_COMPANY;
  STATE.loaded = true;
  return true;
}
function showLoadError(msg) {
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2 style="color:var(--danger);">Couldn't load data</h2>
      <p>${esc(msg)}</p>
      <p class="note">This usually means the database schema hasn't been set up yet, or the Supabase URL/key in this file are wrong. Check Settings > API in your Supabase project against the config at the top of index.html.</p>
    </div>`;
}

/* ---------- Shared create/update/delete helpers ---------- */
async function createCustomerRecord(fields) {
  const { data: numData, error: numErr } = await supabaseClient.rpc('next_customer_number');
  if (numErr) { alert('Could not assign a customer number — ' + numErr.message); return null; }
  const cust = { num: String(numData), chargeVat: true, disabled: false, isNew: true, exportedToQBO: false, ...fields };
  const { error: insErr } = await supabaseClient.from('customers').insert(mapCustomerToDb(cust));
  if (insErr) { alert('Could not save this customer — ' + insErr.message); return null; }
  STATE.customers.push(cust);
  STATE.counters.customerNum = numData;
  return cust;
}
async function createItemRecord(fields) {
  const { data: numData, error: numErr } = await supabaseClient.rpc('next_item_code');
  if (numErr) { alert('Could not assign an item code — ' + numErr.message); return null; }
  const code = `ITM-${String(numData).padStart(4, '0')}`;
  const item = { code, isNew: true, stockQty: null, ...fields };
  const { error: insErr } = await supabaseClient.from('items').insert(mapItemToDb(item));
  if (insErr) { alert('Could not save this item — ' + insErr.message); return null; }
  if (item.stockQty !== null) {
    await supabaseClient.from('stock_movements').insert({
      item_code: code, movement_type: 'initial_count', qty_change: item.stockQty, qty_before: 0, qty_after: item.stockQty,
      created_by: CURRENT_USER ? CURRENT_USER.id : null, created_by_email: CURRENT_USER ? CURRENT_USER.email : null,
    });
  }
  STATE.items.push(item);
  STATE.counters.itemCode = numData;
  return item;
}

// Deducts (sign=-1) or restores (sign=+1) stock for every line item on an
// invoice that matches a catalog item. Custom/free-text line items (no
// matching code in STATE.items) are silently skipped — nothing to track.
async function adjustStockForInvoice(invoiceDoc, sign) {
  const movementType = sign < 0 ? 'invoice_deduct' : 'invoice_restore';
  for (const line of invoiceDoc.items) {
    const catalogItem = STATE.items.find(x => x.code === line.code);
    if (!catalogItem || catalogItem.stockQty === null) continue;
    const delta = sign * (Number(line.qty) || 0);
    if (!delta) continue;
    const { data: newQty, error } = await supabaseClient.rpc('record_stock_movement', {
      p_code: line.code, p_delta: delta, p_type: movementType, p_reference: invoiceDoc.number, p_notes: null,
    });
    if (!error && newQty !== null) catalogItem.stockQty = Number(newQty);
  }
}

function fmtMoney(n) {
  n = Number(n) || 0;
  return n.toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function addDays(iso, days) {
  const d = new Date(iso);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function uid() {
  return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function renderContent() {

    case 'dashboard': return renderDashboard(c);
    case 'newquote': return renderDocBuilder(c, 'quote');
    case 'newinvoice': return renderDocBuilder(c, 'invoice');
    case 'customers': return renderCustomers(c);
    case 'items': return renderItems(c);

let dashFilter = 'all';

function dashboardFilteredDocs() {
  const docs = STATE.documents.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  return docs.filter(d => {
    if (dashFilter === 'quotes' && d.type !== 'quote') return false;
    if (dashFilter === 'invoices' && d.type !== 'invoice') return false;
    if (dashFilter !== 'all' && dashFilter !== 'quotes' && dashFilter !== 'invoices' && d.status !== dashFilter) return false;

function wireDashboardRowActions(tbody) {
  tbody.querySelectorAll('a.cust-link').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); CURRENT_TAB = 'customerSummary'; VIEW_CUSTOMER_NUM = a.dataset.cust; renderNav(); renderContent(); };
  });
  tbody.querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const doc = STATE.documents.find(x => x.id === id);
      if (!doc) return;
      if (btn.dataset.act === 'view') { openPrintPreview(doc); }
      if (btn.dataset.act === 'edit') { loadDocIntoBuilder(doc); }
      if (btn.dataset.act === 'convert') { await convertQuoteToInvoice(doc); }
      if (btn.dataset.act === 'paid') {
        doc.status = 'Paid'; doc.updatedAt = new Date().toISOString();
        const { error } = await supabaseClient.from('documents').update({ status: 'Paid', updated_at: doc.updatedAt }).eq('id', id);
        if (error) { alert('Could not update — ' + error.message); return; }
        refreshDashboardBody();
      }
      if (btn.dataset.act === 'delete') {
        if (confirm(`Delete ${doc.number}? This cannot be undone.`)) {
          const { error } = await supabaseClient.from('documents').delete().eq('id', id);
          if (error) { alert('Could not delete — ' + error.message); return; }
          if (doc.type === 'invoice' && doc.stockDeducted) await adjustStockForInvoice(doc, 1);
          STATE.documents = STATE.documents.filter(x => x.id !== id);
          refreshDashboardBody();
        }
      }
    };
  });
}

function loadDocIntoBuilder(doc) {

  renderNav();

async function convertQuoteToInvoice(quote) {
  const { data: numData, error: numErr } = await supabaseClient.rpc('next_invoice_number');
  if (numErr) { alert(`Could not assign an invoice number — ${numErr.message}`); return; }
  const inv = JSON.parse(JSON.stringify(quote));
  delete inv.id;
  inv.type = 'invoice';
  inv.number = String(numData);
  inv.status = 'Draft';
  inv.issueDate = todayISO();
  inv.dueDate = addDays(inv.issueDate, 30);
  inv.quoteRef = quote.number;
  inv.exportedToQBO = false;
  inv.stockDeducted = false;

  await adjustStockForInvoice(inv, -1);
  inv.stockDeducted = true;

  const { data: insData, error: insErr } = await supabaseClient.from('documents').insert(mapDocToDb(inv)).select().single();
  if (insErr) { alert(`Could not create the invoice — ${insErr.message}`); return; }
  inv.id = insData.id;
  inv.createdAt = insData.created_at;
  inv.updatedAt = insData.updated_at;
  STATE.counters.invoiceNum = numData;

  const { error: updErr } = await supabaseClient.from('documents').update({ status: 'Converted' }).eq('id', quote.id);
  if (updErr) { alert(`Invoice was created, but could not mark the quote as converted — ${updErr.message}`); }
  else { quote.status = 'Converted'; quote.updatedAt = new Date().toISOString(); }

  STATE.documents.unshift(inv);
  loadDocIntoBuilder(inv);
}

/* ===================== Document builder (Quote / Invoice) ===================== */
function blankDraft(type) {
  return {
    id: uid(),
    type,
    number: null,
    status: 'Draft',
    customer: null,
    truckReg: '', reg6m: '', reg12m: '', customerDepo: '', poNumber: '', jobcard: '', tec: '', hkm: '',
    quoteRef: '',
    issueDate: todayISO(),
    dueDate: type === 'invoice' ? addDays(todayISO(), 30) : '',
    items: [{ code: '', desc: '', qty: 1, rate: 0, vat: 'Standard', notes: '' }],
    subtotal: 0, taxTotal: 0, total: 0,
    exportedToQBO: false,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
}

function computeTotals(draft) {
  let subtotal = 0, tax = 0;
  draft.items.forEach(it => {
    const amt = (Number(it.qty) || 0) * (Number(it.rate) || 0);
    subtotal += amt;
    if (it.vat === 'Standard') tax += amt * 0.15;
  });
  draft.subtotal = subtotal;
  draft.taxTotal = tax;
  draft.total = subtotal + tax;
}

        <div class="trow"><span>VAT (15%)</span><span>R ${fmtMoney(d.taxTotal)}</span></div>
        <div class="trow total"><span>Total</span><span>R ${fmtMoney(d.total)}</span></div>

  renderLineItemsRows();

}

function applyItemToRow(idx, item) {
  CURRENT_DRAFT.items[idx] = {
    code: item.code, desc: item.desc,
    qty: CURRENT_DRAFT.items[idx].qty || 1,
    rate: item.price,
    vat: item.vat === 'VAT Free' ? 'Zero-rated' : 'Standard',
    notes: CURRENT_DRAFT.items[idx].notes || '',
  };
  renderLineItemsRows();
  updateTotalsDisplay();
}

function attachItemAutocomplete(inputEl, resultsBox, idx, matchType) {
  function showMatches(query) {
    const q = query.toLowerCase().trim();
    const matches = q.length < 1
      ? STATE.items.slice(0, 20)
      : STATE.items.filter(it => matchType === 'code' ? it.code.toLowerCase().includes(q) : it.desc.toLowerCase().includes(q)).slice(0, 20);
    if (!matches.length) { resultsBox.innerHTML = '<div style="color:var(--steel);">No matching items</div>'; resultsBox.style.display = 'block'; return; }
    const hint = (q.length < 1 && STATE.items.length > matches.length)
      ? `<div style="color:var(--steel);font-style:italic;cursor:default;">Showing ${matches.length} of ${STATE.items.length} — type to search</div>`
      : '';
    resultsBox.innerHTML = hint + matches.map(m => `<div data-code="${esc(m.code)}"><b>${esc(matchType==='code' ? m.code : m.desc)}</b><div class="meta">${esc(matchType==='code' ? m.desc : m.code)} · R ${fmtMoney(m.price)} · ${m.vat==='VAT Free'?'Zero-rated':'Standard'}</div></div>`).join('');
    resultsBox.style.display = 'block';
    resultsBox.querySelectorAll('div[data-code]').forEach(opt => {
      // mousedown fires before blur, so selection registers even though the
      // input loses focus right after — click alone can be swallowed by blur.
      opt.onmousedown = (ev) => {
        ev.preventDefault();
        const item = STATE.items.find(x => x.code === opt.dataset.code);
        if (item) applyItemToRow(idx, item);
      };
    });
  }
  inputEl.oninput = e => {
    const val = e.target.value;
    CURRENT_DRAFT.items[idx][matchType === 'code' ? 'code' : 'desc'] = val;
    showMatches(val);
  };
  inputEl.onfocus = () => showMatches(inputEl.value);
  inputEl.onblur = () => setTimeout(() => { resultsBox.style.display = 'none'; }, 200);
}

function renderLineItemsRows() {
  const d = CURRENT_DRAFT;
  const body = document.getElementById('lineItemsBody');
  body.innerHTML = d.items.map((it, idx) => `
    <tr data-idx="${idx}">
      <td data-label="Code" style="position:relative;">
        <input type="text" class="li-code" value="${esc(it.code)}" style="width:100%;" autocomplete="off">
        <div class="search-results li-code-results" style="display:none;"></div>
      </td>
      <td data-label="Description" style="position:relative;">
        <input type="text" class="li-desc" value="${esc(it.desc)}" style="width:100%;" autocomplete="off">
        <div class="search-results li-desc-results" style="display:none;"></div>
        <input type="text" class="li-notes" value="${esc(it.notes || '')}" placeholder="Add details for this item (optional)" style="width:100%;margin-top:4px;font-size:12px;padding:5px 8px;">
      </td>
      <td data-label="Tax">
        <select class="li-vat">
          <option value="Standard" ${it.vat==='Standard'?'selected':''}>Standard</option>
          <option value="Zero-rated" ${it.vat==='Zero-rated'?'selected':''}>Zero-rated</option>
        </select>
      </td>
      <td data-label="Qty"><input type="number" class="li-qty" value="${it.qty}" min="0" step="1" style="width:100%;"></td>
      <td data-label="Rate"><input type="number" class="li-rate" value="${it.rate}" min="0" step="0.01" style="width:100%;"></td>
      <td data-label="Amount" style="text-align:right;padding-top:12px;">R ${fmtMoney((Number(it.qty)||0)*(Number(it.rate)||0))}</td>
      <td data-label="Remove" style="text-align:center;padding-top:10px;"><span class="remove-x" data-idx="${idx}">✕</span></td>
    </tr>
  `).join('');

  body.querySelectorAll('tr').forEach(tr => {
    const idx = Number(tr.dataset.idx);
    attachItemAutocomplete(tr.querySelector('.li-code'), tr.querySelector('.li-code-results'), idx, 'code');
    attachItemAutocomplete(tr.querySelector('.li-desc'), tr.querySelector('.li-desc-results'), idx, 'desc');
    tr.querySelector('.li-vat').onchange = e => { CURRENT_DRAFT.items[idx].vat = e.target.value; updateTotalsDisplay(); };
    tr.querySelector('.li-notes').oninput = e => { CURRENT_DRAFT.items[idx].notes = e.target.value; };
    tr.querySelector('.li-qty').oninput = e => { CURRENT_DRAFT.items[idx].qty = e.target.value; updateTotalsDisplay(); recomputeRowAmount(tr, idx); };
    tr.querySelector('.li-rate').oninput = e => { CURRENT_DRAFT.items[idx].rate = e.target.value; updateTotalsDisplay(); recomputeRowAmount(tr, idx); };
    tr.querySelector('.remove-x').onclick = () => {
      if (CURRENT_DRAFT.items.length <= 1) return;
      CURRENT_DRAFT.items.splice(idx, 1);
      renderLineItemsRows();
      updateTotalsDisplay();
    };
  });
}
function recomputeRowAmount(tr, idx) {
  const it = CURRENT_DRAFT.items[idx];
  tr.children[5].textContent = 'R ' + fmtMoney((Number(it.qty)||0) * (Number(it.rate)||0));
}
function updateTotalsDisplay() {
  computeTotals(CURRENT_DRAFT);

}

function wireBuilderEvents(type) {
  const d = CURRENT_DRAFT;
  document.querySelectorAll('input[data-field]').forEach(inp => {
    inp.oninput = e => { d[e.target.dataset.field] = e.target.value; };
  });
  const issueDateEl = document.getElementById('issueDate');
  if (issueDateEl) issueDateEl.onchange = e => { d.issueDate = e.target.value; };
  const dueDateEl = document.getElementById('dueDate');
  if (dueDateEl) dueDateEl.onchange = e => { d.dueDate = e.target.value; };
  const quoteRefEl = document.getElementById('quoteRef');
  if (quoteRefEl) quoteRefEl.oninput = e => { d.quoteRef = e.target.value; };

  const custSearch = document.getElementById('custSearch');
  const custResults = document.getElementById('custResults');
  if (custSearch) {
    function showCustMatches(query) {
      const q = query.toLowerCase().trim();
      const matches = q.length < 1
        ? STATE.customers.slice(0, 20)
        : STATE.customers.filter(c => c.name.toLowerCase().includes(q) || String(c.num).includes(q)).slice(0, 20);
      if (!matches.length) { custResults.innerHTML = '<div style="color:var(--steel);">No matches</div>'; custResults.style.display = 'block'; return; }
      const hint = (q.length < 1 && STATE.customers.length > matches.length)
        ? `<div style="color:var(--steel);font-style:italic;cursor:default;">Showing ${matches.length} of ${STATE.customers.length} — type to search</div>`
        : '';
      custResults.innerHTML = hint + matches.map(m => `<div data-num="${esc(m.num)}"><b>${esc(m.name)}</b><div class="meta">#${esc(m.num)} · ${esc(m.city)}</div></div>`).join('');
      custResults.style.display = 'block';
      custResults.querySelectorAll('div[data-num]').forEach(opt => {
        opt.onmousedown = (ev) => {
          ev.preventDefault();
          d.customer = STATE.customers.find(c => c.num === opt.dataset.num);
          renderContent();
        };
      });
    }
    custSearch.oninput = e => showCustMatches(e.target.value);
    custSearch.onfocus = () => showCustMatches(custSearch.value);
    custSearch.onblur = () => setTimeout(() => { custResults.style.display = 'none'; }, 200);
  }
  const changeBtn = document.getElementById('changeCustBtn');
  if (changeBtn) changeBtn.onclick = () => { d.customer = null; renderContent(); };
  const addCustInlineBtn = document.getElementById('addCustInlineBtn');
  if (addCustInlineBtn) addCustInlineBtn.onclick = () => renderInlineCustomerForm();

  const addLineBtn = document.getElementById('addLineBtn');
  if (addLineBtn) addLineBtn.onclick = () => { d.items.push({ code:'', desc:'', qty:1, rate:0, vat:'Standard', notes: '' }); renderLineItemsRows(); updateTotalsDisplay(); };

  const saveBtn = document.getElementById('saveDraftBtn');
  if (saveBtn) saveBtn.onclick = () => saveDocument(type);
  const previewBtn = document.getElementById('previewBtn');
  if (previewBtn) previewBtn.onclick = async () => { await saveDocument(type, true); };
}

async function saveDocument(type, preview) {
  const d = CURRENT_DRAFT;
  if (!d.customer) { alert('Please select or add a customer first — use the customer search box above and click a result to select it.'); return; }
  computeTotals(d);
  const existingIdx = STATE.documents.findIndex(x => x.id === d.id);
  const isNewDoc = existingIdx === -1;

  if (isNewDoc) {
    if (!d.number) {
      const rpcName = type === 'quote' ? 'next_quote_number' : 'next_invoice_number';
      const { data: numData, error: numErr } = await supabaseClient.rpc(rpcName);
      if (numErr) { alert(`Could not assign a number — ${numErr.message}`); return; }
      d.number = String(numData);
      STATE.counters[type === 'quote' ? 'quoteNum' : 'invoiceNum'] = numData;
    }
    d.status = d.status || 'Draft';
    if (type === 'invoice' && !d.stockDeducted) {
      await adjustStockForInvoice(d, -1);
      d.stockDeducted = true;
    }
    const { data: insData, error: insErr } = await supabaseClient.from('documents').insert(mapDocToDb(d)).select().single();
    if (insErr) { alert(`Could not save this ${type} — ${insErr.message}`); return; }
    d.id = insData.id;
    d.createdAt = insData.created_at;
    d.updatedAt = insData.updated_at;
    STATE.documents.unshift(d);
  } else {
    d.updatedAt = new Date().toISOString();
    const { error: updErr } = await supabaseClient.from('documents').update(mapDocToDb(d)).eq('id', d.id);
    if (updErr) { alert(`Could not save this ${type} — ${updErr.message}`); return; }
    STATE.documents[existingIdx] = d;
  }

  if (preview) { renderContent(); openPrintPreview(d); }
  else {
    VIEW_CUSTOMER_NUM = d.customer.num;
    CURRENT_TAB = 'customerSummary';
    renderNav();
    renderContent();
  }
}

function buildEmailBody(doc, co, isInvoice) {
  const greetName = doc.customer.contact || doc.customer.name;
  const totalStr = 'R ' + fmtMoney(doc.total);
  const lines = [`Dear ${greetName},`, ''];
  if (isInvoice) {
    lines.push(`Please find attached Invoice ${doc.number} for ${totalStr} (incl. VAT), due by ${fmtDate(doc.dueDate)}.`);
    lines.push('');
    lines.push('Banking details are included on the invoice — please use the invoice number as your payment reference.');
  } else {
    lines.push(`Please find attached Quote ${doc.number} for ${totalStr} (incl. VAT).`);
    lines.push('');
    lines.push('This quote is valid for 30 days from the date of issue. Let us know if you would like to go ahead.');
  }
  lines.push('', 'Kind regards,', co.name, co.phone, co.email);
  return lines.join('\n');
}

function emailDocument(doc) {
  const co = STATE.company;
  const isInvoice = doc.type === 'invoice';
  const email = (doc.customer.email || '').trim();
  if (!email) {
    alert(`${doc.customer.name} has no email address on file. Add one in the Customers tab, then try again.`);
    return;
  }
  const subject = `${isInvoice ? 'Invoice' : 'Quote'} ${doc.number} — ${co.name}`;
  const body = buildEmailBody(doc, co, isInvoice);
  alert('Your email app will now open with the message ready. This tool can\'t attach the PDF automatically — use "Print / Save as PDF" first (if you haven\'t already) and attach the saved file before sending.');
  const mailto = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const a = document.createElement('a');
  a.href = mailto;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ===================== Customers tab ===================== */
let custSearchTab = '';
function customersTabRowsHtml() {
  const filtered = STATE.customers.filter(x => !custSearchTab || x.name.toLowerCase().includes(custSearchTab.toLowerCase()) || String(x.num).includes(custSearchTab));
  const rows = filtered.slice(0, 200).map(x => `
    <tr class="cust-row" data-num="${esc(x.num)}" style="cursor:pointer;">
      <td data-label="#">${esc(x.num)}</td><td data-label="Name">${esc(x.name)}${x.isNew ? '<span class="badge-new">NEW</span>' : ''}</td>
      <td data-label="Contact">${esc(x.contact)}</td><td data-label="Email">${esc(x.email)}</td><td data-label="Phone">${esc(x.phone)}</td><td data-label="City">${esc(x.city)}</td><td data-label="VAT No.">${esc(x.vat)}</td>
    </tr>
  `).join('');
  const more = filtered.length > 200 ? `<p class="note">Showing first 200 of ${filtered.length} matches — refine your search to see more.</p>` : '';
  return { rows, more, count: filtered.length };
}
function wireCustomersTabRows(tbody) {
  tbody.querySelectorAll('tr.cust-row').forEach(tr => {
    tr.onclick = () => { VIEW_CUSTOMER_NUM = tr.dataset.num; CURRENT_TAB = 'customerSummary'; renderNav(); renderContent(); };
  });
}
function refreshCustomersTabBody() {
  const tbody = document.getElementById('custTabTbody');
  const moreEl = document.getElementById('custTabMore');
  if (!tbody) return;
  const { rows, more } = customersTabRowsHtml();
  tbody.innerHTML = rows;
  wireCustomersTabRows(tbody);
  if (moreEl) moreEl.innerHTML = more;
}
function renderCustomers(c) {
  const { rows, more } = customersTabRowsHtml();
  c.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <h2 style="border:none;">Customers <span class="note">(${STATE.customers.length} total)</span></h2>
        <input type="text" placeholder="Search…" id="custTabSearch" value="${esc(custSearchTab)}" style="max-width:240px;">
      </div>
      <button class="btn accent small" id="addCustTabBtn" style="margin-bottom:12px;">+ Add Customer</button>
      <p class="note" style="margin-top:-6px;margin-bottom:12px;">Click a customer row to view their transaction history.</p>
      <div id="custTabForm"></div>
      <table class="data">
        <thead><tr><th>#</th><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>City</th><th>VAT No.</th></tr></thead>
        <tbody id="custTabTbody">${rows}</tbody>
      </table>
      <div id="custTabMore">${more}</div>
    </div>

let itemSearchTab = '';
let itemLowStockOnly = false;
function isLowStock(x) {
  return x.stockQty !== null && x.stockQty < STATE.company.reorderThreshold;
}
function itemsTabRowsHtml() {
  const filtered = STATE.items.filter(x => {
    if (itemLowStockOnly && !isLowStock(x)) return false;
    return !itemSearchTab || x.desc.toLowerCase().includes(itemSearchTab.toLowerCase()) || x.code.toLowerCase().includes(itemSearchTab.toLowerCase());
  });
  const rows = filtered.slice(0, 200).map(x => {
    const isLow = isLowStock(x);
    const stockCell = x.stockQty === null
      ? `<input type="number" class="stock-initial-input" min="0" placeholder="Not set" style="width:80px;">
         <button class="btn ghost small stock-set-btn" data-code="${esc(x.code)}">Set</button>`
      : `<b>${x.stockQty}</b>
         <button class="btn ghost small stock-correct-btn" data-code="${esc(x.code)}" style="margin-left:6px;">Correct</button>
         <button class="btn ghost small stock-history-btn" data-code="${esc(x.code)}">History</button>`;
    return `
    <tr style="${isLow ? 'background:#fef2f2;' : ''}">
      <td data-label="Code">${esc(x.code)}</td>
      <td data-label="Description">${esc(x.desc)}${x.isNew ? '<span class="badge-new">NEW</span>':''}${isLow ? ' <span class="pill overdue">Reorder</span>' : ''}
        <button class="btn ghost small item-edit-btn" data-code="${esc(x.code)}" style="margin-left:6px;">Edit</button>
      </td>
      <td data-label="Price">R ${fmtMoney(x.price)}</td>
      <td data-label="VAT">${x.vat}</td>
      <td data-label="Stock Qty" style="white-space:nowrap;">${stockCell}</td>
    </tr>`;
  }).join('');
  const more = filtered.length > 200 ? `<p class="note">Showing first 200 of ${filtered.length} matches — refine your search to see more.</p>` : '';
  return { rows, more };
}
function openEditItemModal(code) {
  const item = STATE.items.find(x => x.code === code);
  if (!item) return;
  const modalHtml = `
    <div id="itemEditModal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;" class="no-print">
      <div style="max-width:420px;width:100%;background:#fff;border-radius:8px;overflow:hidden;">

        <div style="padding:20px;">
          <div class="field"><label>Description</label><input type="text" id="ieDesc" value="${esc(item.desc)}"></div>
          <div class="field"><label>Price (R)</label><input type="number" step="0.01" id="iePrice" value="${item.price}"></div>
          <div class="field"><label>VAT</label>
            <select id="ieVat">
              <option value="15% VAT" ${item.vat === '15% VAT' ? 'selected' : ''}>Standard (15%)</option>
              <option value="VAT Free" ${item.vat === 'VAT Free' ? 'selected' : ''}>Zero-rated</option>
            </select>
          </div>
          <button class="btn accent small" id="ieSaveBtn">Save Changes</button>
          <button class="btn ghost small" id="ieCancelBtn">Cancel</button>
        </div>
      </div>
    </div>`;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = modalHtml;
  document.body.appendChild(wrapper.firstElementChild);
  document.getElementById('ieCancelBtn').onclick = () => document.getElementById('itemEditModal').remove();
  document.getElementById('ieSaveBtn').onclick = async () => {
    const newDesc = document.getElementById('ieDesc').value.trim();
    if (!newDesc) { alert('Description is required.'); return; }
    const newPrice = Number(document.getElementById('iePrice').value) || 0;
    const newVat = document.getElementById('ieVat').value;
    if (newDesc !== item.desc) {
      const stockNote = item.stockQty === null ? 'not tracked' : `currently ${item.stockQty}`;
      const ok = confirm(
        `Rename "${item.desc}" to "${newDesc}"?\n\n` +
        `This only changes the name shown when staff pick this item going forward. It will NOT change:\n` +
        `• The stock quantity (${stockNote}) — renaming is not a stock movement\n` +
        `• Any quote or invoice already created — those keep the description exactly as it was at the time\n\n` +
        `Continue with the rename?`
      );
      if (!ok) return;
    }
    const { error } = await supabaseClient.from('items').update({ description: newDesc, price: newPrice, vat: newVat }).eq('code', code);
    if (error) { alert('Could not save changes — ' + error.message); return; }
    item.desc = newDesc; item.price = newPrice; item.vat = newVat;
    document.getElementById('itemEditModal').remove();

}
function wireItemsTabStockInputs(tbody) {
  tbody.querySelectorAll('.item-edit-btn').forEach(btn => { btn.onclick = () => openEditItemModal(btn.dataset.code); });
  tbody.querySelectorAll('.stock-set-btn').forEach(btn => {
    btn.onclick = async () => {
      const code = btn.dataset.code;
      const input = btn.closest('td').querySelector('.stock-initial-input');
      const raw = input.value.trim();
      if (raw === '') { alert('Enter a starting quantity first.'); return; }
      const qty = Number(raw);
      if (!Number.isFinite(qty) || qty < 0) { alert('Enter a valid, non-negative number.'); return; }
      if (!confirm(`Set the starting stock count to ${qty}? This can only be done once — after this, changes must go through a correction or a stock receipt.`)) return;
      const { data: newQty, error } = await supabaseClient.rpc('set_initial_stock', { p_code: code, p_qty: qty });
      if (error) { alert('Could not set stock — ' + error.message); return; }
      if (newQty === null) { alert('This item already has a stock count set — refresh to see it.'); return; }
      const item = STATE.items.find(x => x.code === code);
      if (item) item.stockQty = newQty;
      refreshItemsTabBody();
    };
  });
  tbody.querySelectorAll('.stock-correct-btn').forEach(btn => { btn.onclick = () => openStockCorrectionModal(btn.dataset.code); });
  tbody.querySelectorAll('.stock-history-btn').forEach(btn => { btn.onclick = () => openStockHistoryModal(btn.dataset.code); });
}
function openStockCorrectionModal(code) {
  const item = STATE.items.find(x => x.code === code);
  if (!item) return;
  const modalHtml = `
    <div id="stockModal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;" class="no-print">
      <div style="max-width:420px;width:100%;background:#fff;border-radius:8px;overflow:hidden;">
        <div style="padding:12px 20px;background:var(--ink);color:#fff;"><b>Correct stock — ${esc(item.desc)}</b></div>
        <div style="padding:20px;">
          <p class="note">Current count: <b>${item.stockQty}</b>. This is logged permanently with your name and reason — not a silent edit.</p>
          <div class="field"><label>Correct Quantity</label><input type="number" id="corrQty" value="${item.stockQty}" min="0"></div>
          <div class="field"><label>Reason *</label><textarea id="corrReason" rows="3" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:5px;font-family:inherit;"></textarea></div>
          <button class="btn accent small" id="corrSaveBtn">Save Correction</button>
          <button class="btn ghost small" id="corrCancelBtn">Cancel</button>
        </div>
      </div>
    </div>`;
  const wrapper = document.createElement('div');
  wrapper.innerHTML = modalHtml;
  document.body.appendChild(wrapper.firstElementChild);
  document.getElementById('corrCancelBtn').onclick = () => document.getElementById('stockModal').remove();
  document.getElementById('corrSaveBtn').onclick = async () => {
    const newQtyRaw = document.getElementById('corrQty').value.trim();
    const reason = document.getElementById('corrReason').value.trim();
    if (newQtyRaw === '' || !reason) { alert('Enter both a quantity and a reason.'); return; }
    const newQty = Number(newQtyRaw);
    if (!Number.isFinite(newQty) || newQty < 0) { alert('Enter a valid, non-negative number.'); return; }
    const delta = newQty - item.stockQty;
    if (delta === 0) { alert('That is already the current count.'); return; }
    const { data: resultQty, error } = await supabaseClient.rpc('record_stock_movement', { p_code: code, p_delta: delta, p_type: 'correction', p_reference: null, p_notes: reason });
    if (error) { alert('Could not save correction — ' + error.message); return; }
    item.stockQty = resultQty;
    document.getElementById('stockModal').remove();
    refreshItemsTabBody();
  };
}

function renderReceiptItemsRows() {
  const r = CURRENT_RECEIPT;
  const body = document.getElementById('receiptItemsBody');
  body.innerHTML = r.items.map((it, idx) => `
    <tr data-idx="${idx}">
      <td data-label="Description" style="position:relative;">
        <input type="text" class="ri-desc" value="${esc(it.desc)}" style="width:100%;" autocomplete="off">
        <div class="search-results ri-desc-results" style="display:none;"></div>
      </td>
      <td data-label="Code">${esc(it.code)}</td>
      <td data-label="Qty Received"><input type="number" class="ri-qty" value="${it.qty}" min="1" step="1" style="width:100%;"></td>
      <td data-label="Remove" style="text-align:center;"><span class="remove-x" data-idx="${idx}">✕</span></td>
    </tr>
  `).join('');
  body.querySelectorAll('tr').forEach(tr => {
    const idx = Number(tr.dataset.idx);
    const descInput = tr.querySelector('.ri-desc');
    const resultsBox = tr.querySelector('.ri-desc-results');
    function showTrackedMatches(query) {
      const q = query.toLowerCase().trim();
      const trackedItems = STATE.items.filter(x => x.stockQty !== null);
      const matches = q.length < 1 ? trackedItems.slice(0, 20) : trackedItems.filter(x => x.desc.toLowerCase().includes(q) || x.code.toLowerCase().includes(q)).slice(0, 20);
      if (!matches.length) { resultsBox.innerHTML = '<div style="color:var(--steel);">No tracked items match</div>'; resultsBox.style.display = 'block'; return; }
      resultsBox.innerHTML = matches.map(m => `<div data-code="${esc(m.code)}"><b>${esc(m.desc)}</b><div class="meta">${m.code} · current stock ${m.stockQty}</div></div>`).join('');
      resultsBox.style.display = 'block';
      resultsBox.querySelectorAll('div[data-code]').forEach(opt => {
        opt.onmousedown = (ev) => {
          ev.preventDefault();
          const item = STATE.items.find(x => x.code === opt.dataset.code);
          if (item) { r.items[idx] = { code: item.code, desc: item.desc, qty: r.items[idx].qty || 1 }; renderReceiptItemsRows(); }
        };
      });
    }
    descInput.oninput = e => { r.items[idx].desc = e.target.value; r.items[idx].code = ''; showTrackedMatches(e.target.value); };
    descInput.onfocus = () => showTrackedMatches(descInput.value);
    descInput.onblur = () => setTimeout(() => { resultsBox.style.display = 'none'; }, 200);
    tr.querySelector('.ri-qty').oninput = e => { r.items[idx].qty = e.target.value; };
    tr.querySelector('.remove-x').onclick = () => {
      if (r.items.length <= 1) return;

    };
  });
}

async function saveStockReceipt() {
  const r = CURRENT_RECEIPT;
  const validItems = r.items.filter(it => it.code && Number(it.qty) > 0);
  if (!validItems.length) { alert('Add at least one item (picked from the dropdown) with a valid quantity.'); return; }
  const { data: insData, error: insErr } = await supabaseClient.from('stock_receipts').insert({
    supplier: r.supplier, reference: r.reference, receipt_date: r.receiptDate || null,
    items: validItems.map(it => ({ code: it.code, desc: it.desc, qty: Number(it.qty) })),
    notes: r.notes,
    created_by: CURRENT_USER ? CURRENT_USER.id : null, created_by_email: CURRENT_USER ? CURRENT_USER.email : null,
  }).select().single();
  if (insErr) { alert('Could not save receipt — ' + insErr.message); return; }
  for (const it of validItems) {
    const { data: newQty, error } = await supabaseClient.rpc('record_stock_movement', {
      p_code: it.code, p_delta: Number(it.qty), p_type: 'receipt', p_reference: r.reference || insData.id, p_notes: r.notes || null,
    });
    if (!error && newQty !== null) {
      const item = STATE.items.find(x => x.code === it.code);
      if (item) item.stockQty = newQty;
    }
  }
  receiptViewMode = 'list';
  CURRENT_RECEIPT = null;
  renderContent();
  alert('Stock receipt saved and stock updated.');
}

function computeDepreciation(asset) {
  const cost = Number(asset.purchase_cost) || 0;
  const salvage = Number(asset.salvage_value) || 0;
  const life = Number(asset.useful_life_years) || 0;
  if (!asset.purchase_date || !life || cost <= 0) return { accumulated: 0, netBookValue: cost };
  const depreciable = Math.max(cost - salvage, 0);
  const annual = depreciable / life;
  const asOf = asset.disposal_date ? new Date(asset.disposal_date) : new Date();
  const purchaseDate = new Date(asset.purchase_date);
  const yearsElapsed = Math.max(0, (asOf - purchaseDate) / (365.25 * 24 * 3600 * 1000));
  const accumulated = Math.min(annual * yearsElapsed, depreciable);
  return { accumulated, netBookValue: cost - accumulated };
}

  if (error) { alert('Could not reinstate — ' + error.message); return; }
  asset.status = 'In Use'; asset.disposal_date = null; asset.disposal_notes = null;
  renderAssetsList(c);
}

async function deleteAsset(asset, c) {
  if (!confirm(`Delete asset "${asset.name}"? This removes it entirely — if it was ever a real asset, consider Dispose instead to keep the record for prior-year comparisons. This cannot be undone.`)) return;
  const { error } = await supabaseClient.from('assets').delete().eq('id', asset.id);
  if (error) { alert('Could not delete — ' + error.message); return; }
  window.__ASSETS_CACHE__ = (window.__ASSETS_CACHE__ || []).filter(a => a.id !== asset.id);
  renderAssetsList(c);
}

function computeTermsLabel(doc) {
  if (!doc.issueDate || !doc.dueDate) return '';
  if (doc.issueDate === doc.dueDate) return 'Due on receipt';
  const days = Math.round((new Date(doc.dueDate) - new Date(doc.issueDate)) / 86400000);
  if (!isFinite(days) || days <= 0) return '';
  return `Net ${days}`;
}

function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ===================== Auth & Boot ===================== */
function showConfigMissingScreen() {
  document.getElementById('loginScreen').innerHTML = `
    <div class="login-box">
      <h1>Setup needed</h1>
      <p class="note" style="text-align:center;">
        This copy of the app hasn't been connected to a Supabase project yet.
        Open <b>index.html</b> in a text editor and fill in
        <code>window.__SUPABASE_URL__</code> and <code>window.__SUPABASE_ANON_KEY__</code>
        near the bottom of the file with the values from
        Supabase &gt; Project Settings &gt; API, then re-upload it.
      </p>
    </div>`;
}

function showLoginScreen(errorMsg) {
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const errBox = document.getElementById('loginError');
  if (errorMsg) { errBox.textContent = errorMsg; errBox.style.display = 'block'; }
  else { errBox.style.display = 'none'; }
}

async function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('loggedInAs').textContent = CURRENT_USER ? CURRENT_USER.email : '';
  renderNav();
  document.getElementById('content').innerHTML = '<p style="padding:40px;text-align:center;color:var(--steel);">Loading customers, items and documents…</p>';
  const ok = await loadAll();
  if (ok) renderContent();
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { showLoginScreen('Enter both email and password.'); return; }
  const loginBtn = document.getElementById('loginBtn');
  loginBtn.disabled = true; loginBtn.textContent = 'Signing in…';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false; loginBtn.textContent = 'Sign In';
  if (error) { showLoginScreen(error.message); return; }
  CURRENT_USER = { id: data.user.id, email: data.user.email };
  await showApp();
}

async function handleLogout() {
  await supabaseClient.auth.signOut();
  CURRENT_USER = null;
  STATE.loaded = false;
  showLoginScreen();
}

(async function boot() {
  if (!supabaseClient) {
    document.getElementById('loginScreen').innerHTML = `
      <div class="login-box">
        <h1>Couldn't load required library</h1>
        <p class="note" style="text-align:center;">
          This page needs an internet connection to load the Supabase library
          (from cdn.jsdelivr.net). Check your connection, or that a firewall
          or ad-blocker isn't blocking cdn.jsdelivr.net, then refresh.
        </p>
      </div>`;
    return;
  }
  if (!window.__SUPABASE_URL__ || window.__SUPABASE_URL__ === 'YOUR_SUPABASE_PROJECT_URL' ||
      !window.__SUPABASE_ANON_KEY__ || window.__SUPABASE_ANON_KEY__ === 'YOUR_SUPABASE_ANON_KEY') {
    showConfigMissingScreen();
    return;
  }

  document.getElementById('loginBtn').onclick = handleLogin;
  document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
  document.getElementById('logoutBtn').onclick = handleLogout;

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) {
    CURRENT_USER = { id: session.user.id, email: session.user.email };
    await showApp();
  } else {
    showLoginScreen();
  }
})();

</script>
</body>
</html>
